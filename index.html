<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - Gym Website</title>
    <!-- Link đến CSS của trang chủ -->
    <link rel="stylesheet" href="main.css">
    <!-- Link đến CSS của footer -->
    <link rel="stylesheet" href="footer.css">
</head>
<body>
    <!-- Hero Banner -->
    <header class="hero-banner">
        <img src="https://via.placeholder.com/1920x600?text=Hero+Banner" alt="Hero Banner" class="banner-image">
        <div class="banner-content">
            <h1>CHÀO MỪNG ĐẾN GYM WEBSITE</h1>
            <p>Khám phá hành trình sức khỏe và thể thao của bạn!</p>
            <a href="#services" class="cta-button">Tìm hiểu thêm</a>
        </div>
    </header>

    <!-- Nội dung chính -->
    <main>
        <section id="services">
            <h2>Dịch vụ của chúng tôi</h2>
            <p>Nội dung về các dịch vụ gym, yoga, swimming, v.v.</p>
        </section>
    </main>

    <!-- Chèn footer -->
    <div id="footer"></div>
    <script>
        fetch('footer.html')
            .then(response => {
                if (!response.ok) throw new Error('Không tải được footer.html');
                return response.text();
            })
            .then(data => document.getElementById('footer').innerHTML = data)
            .catch(error => console.error('Lỗi khi tải footer:', error));
    </script>
</body>
</html>
